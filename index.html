<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог предметов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div>
    <h1>Каталог предметов</h1>
    <div id="updated" class="muted"></div>
  </div>
  <div class="actions">
    <button id="loadApi" class="btn api-btn" type="button" title="Загрузить актуальные данные напрямую из API blockade3d.com">
      <span class="api-ico" aria-hidden="true">↓</span>
      <span class="api-spin" aria-hidden="true" hidden></span>
      <span class="api-lbl">Загрузить из API</span>
    </button>
    <button id="exportCsv" class="btn ghost" disabled>Экспорт CSV</button>
    <button id="exportJson" class="btn ghost" disabled>Экспорт JSON</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="catalog" role="tab" aria-selected="true">Каталог</button>
  <button class="tab-btn" data-tab="compare" role="tab" aria-selected="false">Сравнение версий</button>
</nav>

<main>
  <section id="status" class="status" hidden></section>

  <!-- ===== Вкладка: Каталог ===== -->
  <section id="catalogView" class="tab-view">
    <section id="loader" class="loader" hidden>
      <label>
        Выберите файл handler.json:
        <input type="file" id="fileInput" accept=".json,application/json">
      </label>
    </section>

    <section id="stats" class="stats" hidden></section>

    <section id="filters" class="filters" hidden>
      <input id="search" type="search" placeholder="Поиск: название, ID, категория… (клавиша /)" autocomplete="off">
      <select id="fType" aria-label="Тип"></select>
      <select id="fCategory" aria-label="Категория"></select>
      <select id="fVisible" aria-label="Доступность"></select>
      <select id="fTheme" aria-label="Тема"></select>
      <input id="fMinLvl" type="number" min="0" placeholder="Ур. от" aria-label="Минимальный уровень от">
      <input id="fMaxLvl" type="number" min="0" placeholder="Ур. до" aria-label="Минимальный уровень до">
      <label><input type="checkbox" id="fUpgrades"> Только с улучшениями</label>
      <label><input type="checkbox" id="fFree"> Бесплатные</label>
      <select id="sort" aria-label="Сортировка">
        <option value="id">По ID</option>
        <option value="name">По названию</option>
        <option value="cost-asc">Цена ↑</option>
        <option value="cost-desc">Цена ↓</option>
        <option value="lvl-asc">Уровень ↑</option>
        <option value="lvl-desc">Уровень ↓</option>
        <option value="upg-desc">Больше улучшений</option>
      </select>
      <button id="reset" class="btn ghost">Сбросить</button>
    </section>

    <div class="list-tools">
      <p id="count" class="muted"></p>
      <div class="seg" role="group" aria-label="Вид списка">
        <button id="viewCards" class="seg-btn active" type="button" aria-pressed="true">▦ Карточки</button>
        <button id="viewRows" class="seg-btn" type="button" aria-pressed="false">☰ Строки</button>
      </div>
    </div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <div class="more">
      <button id="more" class="btn ghost" hidden>Показать ещё</button>
      <button id="moreAll" class="btn" hidden>Показать все</button>
    </div>
  </section>

  <!-- ===== Вкладка: Сравнение ===== -->
  <section id="compareView" class="tab-view" hidden>
    <section class="compare-setup">
      <div class="source-block">
        <h3>1. База (старая версия)</h3>
        <p class="muted">Либо уже открытые в «Каталоге» данные, либо отдельный файл.</p>
        <div class="source-toggle">
          <button id="useCurrentBtn" class="btn ghost" type="button" disabled>
            Текущие данные каталога (<span id="currentCount">0</span>)
          </button>
          <label class="btn ghost file-btn">
            Загрузить файл…
            <input type="file" id="baseFileInput" accept=".json,application/json" hidden>
          </label>
        </div>
        <div id="baseSourceLabel" class="muted source-label"></div>
      </div>

      <div class="source-block">
        <h3>2. Новая версия</h3>
        <p class="muted">handler.json, скачанный после обновления игры.</p>
        <label class="btn file-btn">
          Выбрать файл…
          <input type="file" id="newFileInput" accept=".json,application/json" hidden>
        </label>
        <div id="newSourceLabel" class="muted source-label"></div>
      </div>

      <div class="source-block compare-run">
        <h3>3. Сравнить</h3>
        <p class="muted">Покажем только отличия: новые, удалённые и изменённые предметы.</p>
        <button id="runCompare" class="btn" disabled>Сравнить версии</button>
      </div>
    </section>

    <section id="compareResults" hidden>
      <div class="stats" id="compareStats"></div>

      <div class="filters">
        <input id="cSearch" type="search" placeholder="Поиск по изменениям…" autocomplete="off">
        <select id="cStatus" aria-label="Тип изменения">
          <option value="">Все изменения</option>
          <option value="added">Только новые</option>
          <option value="removed">Только удалённые</option>
          <option value="changed">Только изменённые</option>
        </select>
        <select id="cType" aria-label="Тип предмета"></select>
        <select id="cSort" aria-label="Сортировка">
          <option value="id">По ID</option>
          <option value="magnitude">Сильнее всего изменились</option>
          <option value="name">По названию</option>
        </select>
        <button id="photoSummary" class="btn ghost" type="button" disabled>📸 Итоговая статистика</button>
        <button id="exportDiffCsv" class="btn ghost" disabled>Экспорт CSV</button>
        <button id="exportDiffJson" class="btn ghost" disabled>Экспорт JSON</button>
      </div>

      <p id="cCount" class="muted"></p>
      <div id="diffList" class="diff-list" aria-live="polite"></div>
      <div class="more"><button id="cMore" class="btn ghost" hidden>Показать ещё</button></div>
    </section>
  </section>
</main>

<dialog id="modal" aria-labelledby="modalTitle">
  <button id="modalClose" class="close" aria-label="Закрыть">✕</button>
  <div id="modalBody" class="modal-body"></div>
</dialog>

<dialog id="photoModal" aria-label="Предпросмотр фото">
  <button id="photoClose" class="close" aria-label="Закрыть">✕</button>
  <div class="modal-body photo-body">
    <img id="photoImg" alt="Сгенерированное изображение">
    <div class="photo-actions">
      <a id="photoDownload" class="btn" download>Скачать PNG (1720×1280)</a>
    </div>
  </div>
</dialog>

<script type="module" src="main.js"></script>
</body>
</html>
